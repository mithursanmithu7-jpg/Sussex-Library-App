<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

--goldsoft:#12414f;--okbg:#0e3b25;--ok:#8be0a6;--warnbg:#3f3410;--warn:#f1cf7a;--badbg:#4a1626;--bad:#ffb3c4}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--cyd);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.45;padding:10px;min-height:100vh}
.app{max-width:760px;margin:0 auto;background:var(--shell);border-radius:20px;overflow:hidden;border:3px solid rgba(226,185,121,.5)}
header{background:var(--cy);color:#fff;padding:16px 18px;border-bottom:3px solid var(--gold)}
header h1{font-size:20px;font-weight:800}

nav{display:flex;gap:4px;overflow-x:auto;background:var(--cyd);padding:8px 8px 0}

nav button[aria-selected=true]{background:var(--shell);color:var(--cy)}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding:16px}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;background:var(--okbg);color:var(--ok)}
.banner.late{background:var(--warnbg);color:var(--warn)}.banner.off{background:var(--badbg);color:var(--bad)}
.sim{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut);margin-bottom:12px}
.sim button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12px inherit;font-family:inherit;cursor:pointer}

h2{font-size:17px;font-weight:800;color:var(--cy);margin:2px 0 4px}
@media (prefers-color-scheme:dark){h2{color:var(--gold)}}
.sub{font-size:13px;color:var(--mut);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--okbg);color:var(--ok)}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.b{background:var(--badbg);color:var(--bad)}
.bar{height:8px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cym)}
.btn{border:0;border-radius:10px;padding:8px 13px;font:700 13px inherit;font-family:inherit;cursor:pointer;background:var(--cy);color:#fff}
.btn.g{background:var(--gold);color:var(--cyd)}.btn.o{background:transparent;color:var(--cy);border:1px solid var(--cy)}
@media (prefers-color-scheme:dark){.btn.o{color:var(--gold);border-color:var(--gold)}.btn{background:var(--cym)}}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--cyd)}
.note{background:var(--goldsoft);border-left:4px solid var(--gold);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:8px}
.temp{display:flex;align-items:center;gap:10px}.temp b{font-size:26px;min-width:68px;text-align:center}
.stage{background:var(--cy);color:#fff;border-radius:14px;padding:22px 16px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stage .ic{font-size:52px}.stage h3{font-size:17px}.stage p{font-size:13px;opacity:.9;max-width:460px;margin:0 auto}
.prog{display:flex;gap:4px;margin:10px 0}.prog i{flex:1;height:5px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--gold)}
select,input[type=search]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:14px inherit;font-family:inherit;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.stage .ic{animation:pop .5s}@keyframes pop{from{transform:scale(.6);opacity:0}}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cyd);color:#fff;border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:13px;max-width:92vw;z-index:9}

</div>

<script>
const $=s=>document.querySelector(s);
const TABS=[["twin","Digital twin"],["bot","Chatbot"],["fun","Fun Library"],["vr","VR tour"],["site","vs Website"],["auto","Autopilot"],["ai","Ask & plan"],["live","Live view"],["now","Now"],["rooms","Rooms & temperature"],["pcs","Computers"],["books","Find a book"],["wifi","Wi-Fi"],["video","Lending video"],["future","Future trends"],["staff","Staff view"],["test","Test"]];
const S={tab:"twin",pts:0,stairs:0,qs:{quiet:0,sprint:0},snd:0,msgs:[{r:"bot",m:"Hi, I’m the Sussex Library assistant. Ask about call booths, PCs with your software, how busy it is, study rooms or borrowing."}],st:0,vi:0,issues:[],log:[],ap:null,zi:0,layer:"use",rt:null,q:"",plan:"",cf:0,tests:{},ex:"ok",pcSw:"All",book:0,booths:{2:5,3:2},hold:null,step:0,play:false,timer:null,
 rooms:[{n:"Ground Floor Tech Hub",t:21.5,goal:21.5,req:0},{n:"Floor 1 Silent Reading",t:20.5,goal:20.5,req:0},{n:"Floor 2 Postgraduate Pods",t:21,goal:21,req:0},{n:"Floor 3 Dissertation Suite",t:21.5,goal:21.5,req:0}],
 floors:[{n:"Ground Floor",use:62,note:"Social, café nearby",wifi:5},{n:"Floor 1",use:71,note:"Silent study, no calls",wifi:4},{n:"Floor 2",use:58,note:"Call booths and PC cluster",wifi:5},{n:"Floor 3",use:44,note:"Deep focus, viva pods",wifi:4}],
 pcs:[{id:"PC-204",f:"Floor 2",sw:["SPSS","NVivo","Python"],ok:1},{id:"PC-208",f:"Floor 2",sw:["SPSS","Stata","Python"],ok:1},{id:"PC-301",f:"Floor 3",sw:["NVivo","Python"],ok:1},{id:"PC-112",f:"Floor 1",sw:["MATLAB","Python"],ok:1},{id:"PC-215",f:"Floor 2",sw:["SPSS","MATLAB","Stata"],ok:0}],
 books:[{t:"Research Methods in Psychology",a:"Morling",shelf:"Floor 1, Bay 4B, shelf 3",free:2,tot:4,seen:"2 min ago",miss:0},{t:"Discovering Statistics Using SPSS",a:"Field",shelf:"Floor 2, Bay 6A, shelf 2",free:0,tot:5,seen:"6 min ago",miss:0},{t:"Change by Design",a:"Brown",shelf:"Floor 2, Bay 1A, shelf 4",free:3,tot:3,seen:"4 min ago",miss:0}],
 steps:[["🔎","Check the catalogue","Find the book in Library Search, then open Find a book here. The shelf shows a green check only when it was confirmed recently. If every copy is out, the e-book opens instead."],["🚶","Go to the shelf","Follow the floor, bay and shelf shown. If the book isn’t there, tap “Not on shelf” so staff are told straight away."],["💳","Borrow at the kiosk","Place the book on the self-issue pad and tap your Sussex ID card. The due date appears in your account."],["🔁","Renew or return","Loans renew automatically unless another student requests the book. Return it at any desk or return point."],["🛟","If something goes wrong","Book missing, card not reading or kiosk down? Use Not on shelf, try the e-book, or ask at the Help Desk. Nothing is lost."]]};
const note=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(note.h);note.h=setTimeout(()=>t.hidden=true,3500)};
const age=()=>S.ex==="late"?"14 min ago":S.ex==="offline"?"09:42 (saved copy)":"just now";
const stale=()=>S.ex!=="ok", off=()=>S.ex==="offline";
function banner(){
 const m={ok:"Live: updated "+age()+".",late:"Live data is late. Showing the last confirmed values from 14 minutes ago. Treat free seats and booths as unconfirmed.",offline:"No connection. Showing a saved copy from 09:42. Booking and reporting are paused until you’re back online."}[S.ex];
 return `<div class="sim"><span>Test an exception:</span>${[["ok","Normal"],["late","Data delayed"],["offline","Offline"]].map(([k,l])=>`<button aria-pressed="${S.ex===k}" onclick="S.ex='${k}';draw()">${l}</button>`).join("")}</div><div class="banner ${S.ex==="late"?"late":S.ex==="offline"?"off":""}">${m}</div>`}
function tag(ok,yes,no){return `<span class="tag ${stale()?"w":ok?"":"b"}">${stale()?"Unconfirmed":ok?yes:no}</span>`}
const V={
fun(){const L="CDEFGABC".split(""),nx=[[25,"10 free print pages"],[50,"Booth priority for a day"],[100,"Your group name on the Focus wall"]].find(r=>r[0]>S.pts),T=[["Group 6",S.pts],["Psychology MSc",88],["Data Science MSc",64]].sort((a,b)=>b[1]-a[1]);
return `<h2>Fun Library</h2><p class="sub">Make the right choice the fun choice. Climb the piano stairs, earn points for quiet floors and focus sprints, and see why the library beats working at home.</p>
<div class="card"><div class="name">Piano stairs</div><div class="meta">Tap the steps to play. On real stairs, sensors under each step would play a note and the app would count your climb.</div>
<div style="display:flex;align-items:flex-end;gap:4px;margin-top:10px">${L.map((k,i)=>`<button aria-label="Step ${i+1}, note ${k}" onclick="stp(${i})" style="flex:1;height:${48+i*14}px;border:1px solid var(--line);border-radius:6px 6px 2px 2px;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit;background:${i%2?"var(--cy)":"#fff"};color:${i%2?"#fff":"#0F1F24"}">${k}</button>`).join("")}</div>
<div class="meta" style="margin-top:8px">Steps today: <b>${S.stairs}</b> · floors climbed: <b>${Math.floor(S.stairs/8)}</b> · the lift earns 0 points, every step earns 1.</div></div>
<div class="card"><div class="row"><div class="name">Your points: ${S.pts}</div><span class="tag">${nx?"Next: "+nx[1]+" at "+nx[0]:"All rewards unlocked"}</span></div><div class="bar"><i style="width:${Math.min(100,S.pts)}%"></i></div><div class="meta" style="margin-top:6px">Reward ideas for a pilot, not real Sussex offers.</div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" ${S.qs.quiet?"disabled":""} onclick="S.pts+=20;S.qs.quiet=1;note('Checked in on a quiet floor. Double points: +20');draw()">Check in on Floor 3 (44% full): +20</button><button class="btn o" ${S.qs.sprint?"disabled":""} onclick="sprint()">${S.qs.sprint===1?"Sprint running…":S.qs.sprint===2?"Sprint done":"Start a focus sprint (demo 10 sec): +15"}</button></div></div>
<div class="card"><div class="name">Group leaderboard (demo teams)</div>${T.map((t,i)=>`<div class="row" style="margin-top:6px"><span>${i+1}. ${t[0]}</span><b>${t[1]} pts</b></div>`).join("")}</div>
<div class="card"><div class="name">Focus sound</div><div class="meta">A calm background sound for headphones, made in your browser.</div><div style="margin-top:8px"><button class="btn ${S.snd?"o":""}" onclick="noise(${S.snd?0:1})">${S.snd?"Turn off":"Play soft noise"}</button></div></div>
<div class="card"><div class="name">Free power sockets for your laptop (demo)</div>${[["Ground Floor",26],["Floor 1",18],["Floor 2",30],["Floor 3",24]].map(f=>`<div class="row" style="margin-top:6px"><span>${f[0]}</span><span class="tag">${f[1]} free</span></div>`).join("")}</div>
<h2 style="margin-top:14px">Why choose the library over home?</h2>
${["Power and a strong phone signal at your desk, checked live in the Digital twin.","Software that is costly at home, such as SPSS and NVivo, on library PCs.","Call booths and quiet floors, so you can take calls and still focus.","Points, sprints and the piano stairs make coming in rewarding."].map(x=>`<div class="note">${x}</div>`).join("")}
<p class="meta" style="margin-top:10px">Evidence: in 2009 Volkswagen’s Fun Theory turned a Stockholm subway staircase into a piano, and 66% more people than usual chose the stairs over the escalator during a one-day test. It was one day only, so a library pilot should track whether the effect lasts through a term.</p>`},
bot(){return `<h2>Library chatbot</h2><p class="sub">Ask in plain English. It answers from live demo data and the Library website, and hands over to a person when it isn’t sure.</p>
<div class="card" id="chat" style="max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px">${S.msgs.map(m=>`<div style="align-self:${m.r==="me"?"flex-end":"flex-start"};max-width:85%;padding:8px 11px;border-radius:12px;font-size:13px;background:${m.r==="me"?"var(--cy)":"var(--goldsoft)"};color:${m.r==="me"?"#fff":"var(--ink)"}">${m.m}</div>`).join("")}</div>
<div class="chips">${["Is there a free call booth?","Which PC has SPSS?","How busy is it?","How do I book a study room?","Talk to a person"].map(x=>`<button onclick="send('${x}')">${x}</button>`).join("")}</div>
<div style="display:flex;gap:6px"><input type="search" id="bq" aria-label="Message" placeholder="Type a message" style="margin:0" onkeydown="if(event.key==='Enter')send()"><button class="btn g" onclick="send()">Send</button></div>`},
vr(){return `<h2>Virtual library tour</h2><p class="sub">Walk the library before you arrive. Drag to look around. On a phone, use Cardboard view with a headset viewer. On a WebXR headset, use Enter VR.</p>
<div id="vr" style="height:320px;border-radius:14px;overflow:hidden;touch-action:none;background:#002630"></div>
<div class="chips" style="margin-top:10px">${["Overview","Shelf aisle","Call booths"].map((n,i)=>`<button onclick="vrGo(${i})">${n}</button>`).join("")}<button onclick="S.st=!S.st;this.setAttribute('aria-pressed',S.st)" aria-pressed="false">Cardboard view</button><button id="xrb" onclick="enterXR()" hidden>Enter VR</button></div>
<div class="note">This is a stylised model, not a scan of the real library. A real version would use a 3D scan of each floor, with live data shown on the shelves, booths and PCs. Green lights on the booths mean free.</div>`},
future(){const H=[["Now: this prototype","Simulated data","Digital twin with trust scores, autopilot, chatbot, voice and a VR walkthrough, built to test ideas with students."],["Next 12 months: pilot one floor","Real sensors","Privacy-safe occupancy counts, RFID shelf checks, check-in nudges for booked rooms, and a chatbot that hands over to staff. Measure walking time saved and wrong-shelf trips avoided."],["2 to 3 years: connected library","Campus-wide","Digital twin tied to heating and Wi-Fi systems, personal study agents inside Library Search and Canvas, AR wayfinding to the exact shelf, and AI study tools such as summaries and translation."],["3 to 5 years: immersive library","Emerging","VR and AR spaces for teaching and viva practice, ambient assistants in study rooms, and predictive staffing and opening hours based on demand."]];
const Rk=[["Privacy","Count people, don’t identify them. Run a data protection impact assessment before any camera or Wi-Fi tracking."],["Accuracy","Chatbots can be wrong. Show sources and always offer a route to a person."],["Access","Everything must work with screen readers, captions and low-bandwidth phones."],["Cost and culture","Pilot small, measure, and keep library staff in the loop."]];
return `<h2>Where the library website is heading</h2><p class="sub">A roadmap for Group 6. Recent library technology writing keeps returning to AI services, IoT and smart spaces, and immersive VR and AR.</p>`+H.map(h=>`<div class="card"><div class="row"><div class="name">${h[0]}</div><span class="tag w">${h[1]}</span></div><div class="meta" style="margin-top:6px">${h[2]}</div></div>`).join("")+`<h2 style="margin-top:14px">Risks to design for</h2>`+Rk.map(r=>`<div class="note"><b>${r[0]}:</b> ${r[1]}</div>`).join("")+`<p class="meta" style="margin-top:10px">Trend sources: Computers in Libraries (Mar/Apr 2026) on AI in library systems; an SJSU 2026 chapter on immersive smart library ecosystems; reviews of chatbots and VR in academic libraries.</p>`},
site(){const R=[["Find a book","Library Search shows the catalogue record.","Adds shelf confidence, a Not on shelf alert to staff and an instant e-book fallback."],["Study room","Book a group room on the Library site: 3 hours a day, and check in at the door QR code within 30 minutes.","Adds check-in reminders and an automatic Plan B if the booking is cancelled."],["Call booth right now","No live free-now view on the pages reviewed.","Shows free booths per floor and holds one for 15 minutes."],["Which PC has my software","Not shown on the pages reviewed.","Filters PCs by SPSS, NVivo, Python and more, and reroutes if one is taken."],["How busy is it","Not shown on the pages reviewed.","Digital twin with trust scores and a best-time forecast."],["Phone Wi-Fi and comfort","Not shown on the pages reviewed.","Signal by zone, room temperature requests and issue reports."],["When something goes wrong","Chat 9am to 5pm Monday to Friday, or the Service Desk in staffed hours.","Autopilot re-plans at any hour, and the Staff view groups reports so causes get fixed once."]];
return `<h2>What the website already does, and what this adds</h2><p class="sub">The Library website is the front door: information and booking links. This app is the live layer on top, so it never replaces those services.</p>`+R.map(r=>`<div class="card"><div class="name">${r[0]}</div><div class="meta" style="margin-top:4px"><b>Website:</b> ${r[1]}</div><div class="note"><b>This app:</b> ${r[2]}</div></div>`).join("")+`<h2 style="margin-top:14px">Official Library services</h2><div class="chips">${[["Library Search","https://sussex.primo.exlibrisgroup.com/discovery/search?vid=44SUS_INST:44SUS_VU1"],["Book a study room","https://sussex.libcal.com/space/17805"],["Library chat","https://sussex-ac-uk.libanswers.com/chat/widget/149b172f7b741bce9b79194bbe0b49e3c94edad4cfdb50652ab570001b3ccda0"],["Opening hours","https://www.sussex.ac.uk/library/using-the-library/hours"]].map(l=>`<a href="${l[1]}" target="_blank" rel="noopener" class="btn o" style="text-decoration:none">${l[0]}</a>`).join("")}</div><p class="meta">Based on the Library home page and Study rooms page. Check other pages before you present this.</p>`},
twin(){const Z=zones(S.cf),L={use:["Seats taken",z=>z.use/100,z=>z.use+"%"],wifi:["Phone signal",z=>(5-z.bars)/4,z=>z.bars+"/5"],temp:["Temperature",z=>Math.min(1,Math.abs(z.temp-21)/2),z=>z.temp.toFixed(1)+"°"],noise:["Noise",z=>Math.min(1,Math.max(0,(z.noise-30)/30)),z=>z.noise+" dB"]},ly=L[S.layer],zz=Z[S.zi],kf=S.ex==="ok"?1:S.ex==="late"?.6:.3,src=[["Camera people count",96],["Wi-Fi device count",91],["RFID shelf tags",99],["PC log-ins",100]].map(([n,v])=>[n,Math.round(v*kf)]),fu=Math.round(src.reduce((a,s)=>a+s[1],0)/src.length);
const rt=S.rt!=null?`<path d="M20 282 L${162+(S.rt%2)*315} ${72+Math.floor(S.rt/2)*135}" stroke="#003B49" stroke-width="5" stroke-dasharray="8 8" fill="none"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></path>`:"";
return `<h2>Digital twin</h2><p class="sub">A live model of each floor, built from cameras, Wi-Fi, shelf tags and PC log-ins. Tap a zone to see how far to trust it.</p>
<div class="chips">${S.floors.map((x,i)=>`<button aria-pressed="${S.cf===i}" onclick="S.cf=${i};S.rt=null;draw()">${x.n}</button>`).join("")}</div>
<div class="chips">${Object.keys(L).map(k=>`<button aria-pressed="${S.layer===k}" onclick="S.layer='${k}';draw()">${L[k][0]}</button>`).join("")}</div>
<div class="card" style="padding:8px"><svg viewBox="0 0 640 290" style="width:100%" role="group" aria-label="Floor map">${Z.map((q,i)=>{const x=10+(i%2)*315,y=10+Math.floor(i/2)*135,b=ly[1](q);return `<g onclick="S.zi=${i};draw()" style="cursor:pointer"><rect x="${x}" y="${y}" width="305" height="125" rx="12" fill="hsl(${140-b*130},55%,68%)" stroke="${S.zi===i?"#003B49":"none"}" stroke-width="5"/><text x="${x+14}" y="${y+30}" font-size="16" font-weight="700" fill="#0F1F24">${q.n}</text><text x="${x+14}" y="${y+78}" font-size="32" font-weight="800" fill="#0F1F24">${ly[2](q)}</text></g>`}).join("")}${rt}</svg><div class="meta">Green is better, red is worse.</div></div>
<div class="card"><div class="row"><div class="name">${S.floors[S.cf].n}: ${zz.n}</div><span class="tag ${fu>=80?"":"w"}">Trust ${fu}%</span></div>
${src.map(s=>`<div class="meta" style="margin-top:6px">${s[0]} ${s[1]}%</div><div class="bar" style="margin-top:2px"><i style="width:${s[1]}%"></i></div>`).join("")}
<div class="note">${fu>=80?"Four independent sources agree, so it’s safe to act on.":"Sources are stale or missing. Check before you travel."}</div>
